    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (!theme) {
                var hour = new Date().getHours();
                theme = (hour <= 6 || hour >= 18) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
