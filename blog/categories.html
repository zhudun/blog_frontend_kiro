<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类 - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="ri-quill-pen-line"></i>
                <span>MyBlog</span>
            </a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="categories.html" class="active">分类</a>
                <a href="tags.html">标签</a>
                <a href="about.html">关于</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle"><i class="ri-moon-line"></i></button>
                <div class="auth-buttons" id="authButtons">
                    <a href="login.html" class="btn btn-outline">登录</a>
                    <a href="register.html" class="btn btn-primary">注册</a>
                </div>
                <div class="user-menu" id="userMenu" style="display: none;">
                    <img src="" alt="avatar" class="user-avatar" id="userAvatar">
                    <div class="dropdown">
                        <a href="profile.html"><i class="ri-user-line"></i> 个人中心</a>
                        <a href="write.html"><i class="ri-edit-line"></i> 写文章</a>
                        <a href="favorites.html"><i class="ri-bookmark-line"></i> 我的收藏</a>
                        <a href="#" id="logoutBtn"><i class="ri-logout-box-line"></i> 退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1><i class="ri-folder-line"></i> 文章分类</h1>
                <p>按分类浏览所有文章</p>
            </div>
            
            <div class="categories-grid" id="categoriesGrid">
                <!-- 动态加载 -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 MyBlog. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initAuth();
            loadCategories();
            
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    authAPI.logout();
                });
            }
        });
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.querySelector('#themeToggle i');
            icon.className = savedTheme === 'dark' ? 'ri-sun-line' : 'ri-moon-line';
        }
        
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.querySelector('#themeToggle i');
            icon.className = newTheme === 'dark' ? 'ri-sun-line' : 'ri-moon-line';
        }
        
        function initAuth() {
            const user = api.getUser();
            if (user) {
                document.getElementById('authButtons').style.display = 'none';
                document.getElementById('userMenu').style.display = 'block';
                document.getElementById('userAvatar').src = user.avatar || getDefaultAvatar(user.name);
            }
        }
        
        async function loadCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const res = await categoryAPI.getAll();
                if (res.code === 200) {
                    renderCategories(res.data);
                }
            } catch (error) {
                grid.innerHTML = '<div class="empty-state"><i class="ri-error-warning-line"></i><h3>加载失败</h3></div>';
            }
        }
        
        function renderCategories(categories) {
            const grid = document.getElementById('categoriesGrid');
            const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#3b82f6'];
            
            grid.innerHTML = categories.map((cat, i) => `
                <a href="index.html?category=${cat.id}" class="category-card" style="--accent: ${colors[i % colors.length]}">
                    <div class="icon"><i class="ri-folder-line"></i></div>
                    <h3>${escapeHtml(cat.name)}</h3>
                    <p>${cat.count || 0} 篇文章</p>
                </a>
            `).join('');
        }
    </script>
    
    <style>
        .page-header { text-align: center; padding: 40px 0; }
        .page-header h1 { font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
        .page-header h1 i { color: var(--primary); }
        .page-header p { color: var(--text-secondary); }
        
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
        
        .category-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }
        .category-card .icon {
            width: 64px;
            height: 64px;
            background: var(--accent);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: white;
        }
        .category-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .category-card p { color: var(--text-secondary); font-size: 14px; }
    </style>
</body>
</html>
