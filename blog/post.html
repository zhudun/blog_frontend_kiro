<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - 札记</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (!theme) {
                var hour = new Date().getHours();
                theme = (hour <= 6 || hour >= 18) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div id="loading-box"><div class="spinner-box"><div class="loading-ring"></div><div class="loading-word">加载中...</div></div></div>
    <div id="sidebar"><div id="menu-mask"></div><div id="sidebar-menus"></div></div>
    <div id="body-wrap">
        <header class="post-bg" id="page-header">
            <nav id="nav"></nav>
            <div id="post-info">
                <h1 id="post-title"></h1>
                <div id="post-meta"></div>
            </div>
        </header>
        <main class="layout" id="content-inner">
            <article id="post"></article>
            <div class="aside-content" id="aside-content"></div>
        </main>
        <footer id="footer"></footer>
    </div>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/site.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
