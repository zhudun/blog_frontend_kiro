<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/post.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="ri-quill-pen-line"></i>
                <span>MyBlog</span>
            </a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="categories.html">分类</a>
                <a href="tags.html">标签</a>
                <a href="about.html">关于</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i class="ri-moon-line"></i>
                </button>
                <div class="auth-buttons" id="authButtons">
                    <a href="login.html" class="btn btn-outline">登录</a>
                    <a href="register.html" class="btn btn-primary">注册</a>
                </div>
                <div class="user-menu" id="userMenu" style="display: none;">
                    <img src="" alt="avatar" class="user-avatar" id="userAvatar">
                    <div class="dropdown">
                        <a href="profile.html"><i class="ri-user-line"></i> 个人中心</a>
                        <a href="write.html"><i class="ri-edit-line"></i> 写文章</a>
                        <a href="favorites.html"><i class="ri-bookmark-line"></i> 我的收藏</a>
                        <a href="#" id="logoutBtn"><i class="ri-logout-box-line"></i> 退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 文章内容 -->
    <main class="post-page">
        <article class="post-article" id="postArticle">
            <!-- 动态加载 -->
        </article>

        <!-- 评论区 -->
        <section class="comments-section" id="commentsSection">
            <div class="container">
                <h2 class="section-title">
                    <i class="ri-chat-3-line"></i> 评论 <span id="commentCount">(0)</span>
                </h2>
                
                <!-- 评论输入框 -->
                <div class="comment-form" id="commentForm">
                    <div class="comment-input-wrapper">
                        <img src="" alt="avatar" class="comment-avatar" id="commentAvatar">
                        <div class="comment-input-box">
                            <textarea id="commentInput" placeholder="写下你的评论..." rows="3"></textarea>
                            <div class="comment-actions">
                                <span class="char-count"><span id="charCount">0</span>/500</span>
                                <button class="btn btn-primary" id="submitComment">发表评论</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 评论列表 -->
                <div class="comments-list" id="commentsList">
                    <!-- 动态加载 -->
                </div>

                <!-- 加载更多评论 -->
                <div class="load-more" id="loadMoreComments" style="display: none;">
                    <button class="btn btn-outline" id="loadMoreCommentsBtn">
                        <i class="ri-refresh-line"></i> 加载更多评论
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 文章操作栏 -->
    <aside class="post-actions" id="postActions">
        <button class="action-btn" id="likeBtn" title="点赞">
            <i class="ri-heart-line"></i>
            <span id="likeCount">0</span>
        </button>
        <button class="action-btn" id="favoriteBtn" title="收藏">
            <i class="ri-bookmark-line"></i>
        </button>
        <button class="action-btn" id="shareBtn" title="分享">
            <i class="ri-share-line"></i>
        </button>
        <button class="action-btn" id="commentBtn" title="评论">
            <i class="ri-chat-3-line"></i>
        </button>
        <button class="action-btn" id="backToTopBtn" title="回到顶部">
            <i class="ri-arrow-up-line"></i>
        </button>
    </aside>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="index.html" class="logo">
                        <i class="ri-quill-pen-line"></i>
                        <span>MyBlog</span>
                    </a>
                    <p>分享技术，记录生活</p>
                </div>
                <div class="footer-links">
                    <a href="https://github.com" target="_blank"><i class="ri-github-fill"></i></a>
                    <a href="https://twitter.com" target="_blank"><i class="ri-twitter-x-fill"></i></a>
                    <a href="mailto:contact@example.com"><i class="ri-mail-line"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 MyBlog. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
