<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 札记</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (!theme) {
                var hour = new Date().getHours();
                theme = (hour <= 6 || hour >= 18) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div id="loading-box"><div class="spinner-box"><div class="loading-ring"></div><div class="loading-word">加载中...</div></div></div>
    <div id="sidebar"><div id="menu-mask"></div><div id="sidebar-menus"></div></div>
    <div id="body-wrap">
        <header class="not-home-page" id="page-header">
            <nav id="nav"></nav>
            <div id="page-site-info"><h1 id="page-title">登录</h1></div>
        </header>
        <main class="layout" id="content-inner">
            <div class="auth-card">
                <h2>登录</h2>
                <p class="hint">只用作者账号。这里不开放注册。</p>
                <form id="loginForm">
                    <label class="field">
                        <span>邮箱</span>
                        <input type="email" id="email" autocomplete="username" required>
                    </label>
                    <label class="field">
                        <span>密码</span>
                        <input type="password" id="password" autocomplete="current-password" required>
                    </label>
                    <button type="submit" class="solid-btn" id="submitBtn">进入</button>
                </form>
            </div>
        </main>
        <footer id="footer"></footer>
    </div>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            mountFrame('login');
            document.title = `登录 - ${SITE.name}`;
            if (api.getToken()) window.location.href = 'write.html';
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                btn.disabled = true;
                btn.textContent = '正在进入';
                try {
                    const res = await authAPI.login({ email, password });
                    if (res.code === 200) {
                        api.setToken(res.data.token);
                        api.setUser(res.data.user);
                        const next = getUrlParams().next || 'write.html';
                        const safe = /^[a-zA-Z0-9._?=&%-]+$/.test(next) ? next : 'write.html';
                        window.location.href = safe;
                    } else {
                        showToast(res.message || '邮箱或密码不对', 'error');
                        btn.disabled = false;
                        btn.textContent = '进入';
                    }
                } catch (error) {
                    btn.disabled = false;
                    btn.textContent = '进入';
                }
            });
        });
    </script>
</body>
</html>
