<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="ri-quill-pen-line"></i>
                <span>MyBlog</span>
            </a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="categories.html">分类</a>
                <a href="tags.html">标签</a>
                <a href="about.html">关于</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i class="ri-moon-line"></i>
                </button>
                <div class="user-menu" id="userMenu">
                    <img src="" alt="avatar" class="user-avatar" id="userAvatar">
                    <div class="dropdown">
                        <a href="profile.html"><i class="ri-user-line"></i> 个人中心</a>
                        <a href="write.html"><i class="ri-edit-line"></i> 写文章</a>
                        <a href="favorites.html" class="active"><i class="ri-bookmark-line"></i> 我的收藏</a>
                        <a href="#" id="logoutBtn"><i class="ri-logout-box-line"></i> 退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1><i class="ri-bookmark-line"></i> 我的收藏</h1>
                <p>你收藏的所有文章</p>
            </div>
            
            <div class="posts-list" id="favoritesList">
                <!-- 动态加载 -->
            </div>
            
            <div class="load-more" id="loadMore" style="display: none;">
                <button class="btn btn-outline" id="loadMoreBtn">
                    <i class="ri-refresh-line"></i> 加载更多
                </button>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 MyBlog. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // 检查登录
        if (!api.getToken()) {
            window.location.href = 'login.html';
        }
        
        // 状态
        let currentPage = 1;
        let totalPages = 1;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initAuth();
            loadFavorites();
            
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                authAPI.logout();
            });
            document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
        });
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.querySelector('#themeToggle i');
            icon.className = savedTheme === 'dark' ? 'ri-sun-line' : 'ri-moon-line';
        }
        
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.querySelector('#themeToggle i');
            icon.className = newTheme === 'dark' ? 'ri-sun-line' : 'ri-moon-line';
        }
        
        function initAuth() {
            const user = api.getUser();
            if (user) {
                document.getElementById('userAvatar').src = user.avatar || getDefaultAvatar(user.name);
            }
        }
        
        async function loadFavorites(append = false) {
            const list = document.getElementById('favoritesList');
            if (!append) {
                list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            }
            
            try {
                const res = await favoriteAPI.getList({ page: currentPage, limit: 10 });
                
                if (res.code === 200) {
                    totalPages = res.data.pages;
                    
                    if (append) {
                        list.insertAdjacentHTML('beforeend', renderFavorites(res.data.records));
                    } else {
                        if (res.data.records.length === 0) {
                            list.innerHTML = `
                                <div class="empty-state">
                                    <i class="ri-bookmark-line"></i>
                                    <h3>暂无收藏</h3>
                                    <p>去发现一些有趣的文章吧</p>
                                </div>
                            `;
                        } else {
                            list.innerHTML = renderFavorites(res.data.records);
                        }
                    }
                    
                    // 更新加载更多按钮
                    const loadMoreDiv = document.getElementById('loadMore');
                    loadMoreDiv.style.display = currentPage < totalPages ? 'block' : 'none';
                }
            } catch (error) {
                console.error('加载收藏失败:', error);
            }
        }
        
        function renderFavorites(favorites) {
            return favorites.map(fav => {
                const post = fav.post;
                const cover = post.coverImage || getDefaultCover(post.title);
                const authorAvatar = post.author?.avatar || getDefaultAvatar(post.author?.name || '匿名');
                
                return `
                    <article class="post-card">
                        <div class="cover">
                            <a href="post.html?slug=${post.slug}">
                                <img src="${cover}" alt="${escapeHtml(post.title)}">
                            </a>
                        </div>
                        <div class="content">
                            <a href="categories.html?id=${post.categoryId}" class="category">
                                <i class="ri-folder-line"></i> ${escapeHtml(post.category)}
                            </a>
                            <a href="post.html?slug=${post.slug}">
                                <h3>${escapeHtml(post.title)}</h3>
                            </a>
                            <p class="excerpt">${escapeHtml(post.excerpt || '')}</p>
                            <div class="footer">
                                <a href="author.html?id=${post.author?.id}" class="author">
                                    <img src="${authorAvatar}" alt="${escapeHtml(post.author?.name || '匿名')}">
                                    <div class="author-info">
                                        <span class="author-name">${escapeHtml(post.author?.name || '匿名')}</span>
                                        <span class="post-date">${formatDate(post.createdAt)}</span>
                                    </div>
                                </a>
                                <button class="btn btn-ghost" onclick="removeFavorite(${post.id}, this)">
                                    <i class="ri-bookmark-fill"></i> 取消收藏
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }
        
        async function removeFavorite(postId, btn) {
            try {
                const res = await favoriteAPI.remove(postId);
                if (res.code === 200) {
                    showToast('已取消收藏', 'success');
                    btn.closest('.post-card').remove();
                    
                    // 检查是否还有收藏
                    const list = document.getElementById('favoritesList');
                    if (!list.querySelector('.post-card')) {
                        list.innerHTML = `
                            <div class="empty-state">
                                <i class="ri-bookmark-line"></i>
                                <h3>暂无收藏</h3>
                                <p>去发现一些有趣的文章吧</p>
                            </div>
                        `;
                    }
                }
            } catch (error) {
                showToast('操作失败', 'error');
            }
        }
        
        function loadMore() {
            if (currentPage < totalPages) {
                currentPage++;
                loadFavorites(true);
            }
        }
    </script>
    
    <style>
        .page-header {
            text-align: center;
            padding: 40px 0;
        }
        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .page-header h1 i {
            color: var(--primary);
        }
        .page-header p {
            color: var(--text-secondary);
        }
    </style>
</body>
</html>
