<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签 - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="ri-quill-pen-line"></i>
                <span>MyBlog</span>
            </a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="categories.html">分类</a>
                <a href="tags.html" class="active">标签</a>
                <a href="about.html">关于</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle"><i class="ri-moon-line"></i></button>
                <div class="auth-buttons" id="authButtons">
                    <a href="login.html" class="btn btn-outline">登录</a>
                    <a href="register.html" class="btn btn-primary">注册</a>
                </div>
                <div class="user-menu" id="userMenu" style="display: none;">
                    <img src="" alt="avatar" class="user-avatar" id="userAvatar">
                    <div class="dropdown">
                        <a href="profile.html"><i class="ri-user-line"></i> 个人中心</a>
                        <a href="write.html"><i class="ri-edit-line"></i> 写文章</a>
                        <a href="favorites.html"><i class="ri-bookmark-line"></i> 我的收藏</a>
                        <a href="#" id="logoutBtn"><i class="ri-logout-box-line"></i> 退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1><i class="ri-price-tag-3-line"></i> 文章标签</h1>
                <p>按标签浏览所有文章</p>
            </div>
            
            <div class="tags-cloud" id="tagsCloud">
                <!-- 动态加载 -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 MyBlog. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initAuth();
            loadTags();
            
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    authAPI.logout();
                });
            }
        });
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.querySelector('#themeToggle i');
            icon.className = savedTheme === 'dark' ? 'ri-sun-line' : 'ri-moon-line';
        }
        
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.querySelector('#themeToggle i');
            icon.className = newTheme === 'dark' ? 'ri-sun-line' : 'ri-moon-line';
        }
        
        function initAuth() {
            const user = api.getUser();
            if (user) {
                document.getElementById('authButtons').style.display = 'none';
                document.getElementById('userMenu').style.display = 'block';
                document.getElementById('userAvatar').src = user.avatar || getDefaultAvatar(user.name);
            }
        }
        
        async function loadTags() {
            const cloud = document.getElementById('tagsCloud');
            cloud.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const res = await tagAPI.getAll();
                if (res.code === 200) {
                    renderTags(res.data);
                }
            } catch (error) {
                cloud.innerHTML = '<div class="empty-state"><i class="ri-error-warning-line"></i><h3>加载失败</h3></div>';
            }
        }
        
        function renderTags(tags) {
            const cloud = document.getElementById('tagsCloud');
            const maxCount = Math.max(...tags.map(t => t.count || 1));
            
            cloud.innerHTML = tags.map(tag => {
                const size = 14 + ((tag.count || 1) / maxCount) * 16;
                return `<a href="index.html?tag=${tag.id}" class="tag-item" style="font-size: ${size}px">${escapeHtml(tag.name)} <span>(${tag.count || 0})</span></a>`;
            }).join('');
        }
    </script>
    
    <style>
        .page-header { text-align: center; padding: 40px 0; }
        .page-header h1 { font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
        .page-header h1 i { color: var(--primary); }
        .page-header p { color: var(--text-secondary); }
        
        .tags-cloud {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 48px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }
        
        .tag-item {
            padding: 8px 20px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            transition: var(--transition);
            white-space: nowrap;
        }
        .tag-item:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }
        .tag-item span {
            opacity: 0.7;
            font-size: 0.85em;
        }
    </style>
</body>
</html>
