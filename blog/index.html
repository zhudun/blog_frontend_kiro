<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>札记</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (!theme) {
                var hour = new Date().getHours();
                theme = (hour <= 6 || hour >= 18) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            if (localStorage.getItem('aside-status') === 'hide') {
                document.documentElement.classList.add('hide-aside');
            }
        })();
    </script>
</head>
<body>
    <div id="loading-box">
        <div class="spinner-box">
            <div class="loading-ring"></div>
            <div class="loading-word">加载中...</div>
        </div>
    </div>
    <div id="sidebar"><div id="menu-mask"></div><div id="sidebar-menus"></div></div>
    <div id="body-wrap">
        <header class="full_page" id="page-header">
            <nav id="nav"></nav>
            <div id="site-info">
                <h1 id="site-title">札记</h1>
                <div id="site-subtitle"><span id="subtitle"></span></div>
            </div>
            <div id="scroll-down"><i class="fas fa-angle-down scroll-down-effects"></i></div>
        </header>
        <main class="layout" id="content-inner">
            <div class="recent-posts nc" id="recent-posts">
                <p id="listNote" hidden></p>
                <div class="recent-post-items" id="postsList"></div>
                <nav id="pagination"><div class="pagination" id="pager"></div></nav>
            </div>
            <div class="aside-content" id="aside-content"></div>
        </main>
        <footer id="footer"></footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.16/dist/typed.umd.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/site.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
