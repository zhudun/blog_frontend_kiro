<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>札记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" id="siteHeader"></header>
    <main class="home">
        <section class="masthead">
            <h1 id="siteTitle">札记</h1>
            <p class="lede" id="siteLede"></p>
        </section>
        <div class="toolbar">
            <div class="chips" id="categoryChips"></div>
            <label class="search">
                <input id="searchInput" type="search" placeholder="搜索" aria-label="搜索文章">
            </label>
        </div>
        <p class="list-note" id="listNote" hidden></p>
        <div class="post-list" id="postsList"></div>
        <div class="pager">
            <button type="button" class="quiet-btn" id="loadMoreBtn" hidden>更早的文章</button>
        </div>
    </main>
    <footer class="site-footer" id="siteFooter"></footer>
    <div class="toasts" id="toastContainer"></div>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/site.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
