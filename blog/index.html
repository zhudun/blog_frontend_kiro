<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="ri-quill-pen-line"></i>
                <span>MyBlog</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="active">首页</a>
                <a href="categories.html">分类</a>
                <a href="tags.html">标签</a>
                <a href="about.html">关于</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i class="ri-moon-line"></i>
                </button>
                <div class="auth-buttons" id="authButtons">
                    <a href="login.html" class="btn btn-outline">登录</a>
                    <a href="register.html" class="btn btn-primary">注册</a>
                </div>
                <div class="user-menu" id="userMenu" style="display: none;">
                    <img src="" alt="avatar" class="user-avatar" id="userAvatar">
                    <div class="dropdown">
                        <a href="profile.html"><i class="ri-user-line"></i> 个人中心</a>
                        <a href="write.html"><i class="ri-edit-line"></i> 写文章</a>
                        <a href="favorites.html"><i class="ri-bookmark-line"></i> 我的收藏</a>
                        <a href="#" id="logoutBtn"><i class="ri-logout-box-line"></i> 退出登录</a>
                    </div>
                </div>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="ri-menu-line"></i>
            </button>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <div class="container">
            <!-- 特色文章轮播 -->
            <section class="featured-section" id="featuredSection">
                <h2 class="section-title">
                    <i class="ri-star-line"></i> 精选文章
                </h2>
                <div class="featured-posts" id="featuredPosts">
                    <!-- 动态加载 -->
                </div>
            </section>

            <!-- 文章列表区域 -->
            <div class="content-wrapper">
                <div class="posts-section">
                    <!-- 筛选栏 -->
                    <div class="filter-bar">
                        <div class="filter-tabs">
                            <button class="filter-tab active" data-sort="createdAt">最新</button>
                            <button class="filter-tab" data-sort="views">热门</button>
                            <button class="filter-tab" data-sort="likes">最多点赞</button>
                        </div>
                        <div class="search-box">
                            <i class="ri-search-line"></i>
                            <input type="text" placeholder="搜索文章..." id="searchInput">
                        </div>
                    </div>

                    <!-- 文章列表 -->
                    <div class="posts-list" id="postsList">
                        <!-- 动态加载 -->
                    </div>

                    <!-- 加载更多 -->
                    <div class="load-more" id="loadMore">
                        <button class="btn btn-outline" id="loadMoreBtn">
                            <i class="ri-refresh-line"></i> 加载更多
                        </button>
                    </div>
                </div>

                <!-- 侧边栏 -->
                <aside class="sidebar">
                    <!-- 分类 -->
                    <div class="sidebar-card">
                        <h3 class="sidebar-title">
                            <i class="ri-folder-line"></i> 分类
                        </h3>
                        <ul class="category-list" id="categoryList">
                            <!-- 动态加载 -->
                        </ul>
                    </div>

                    <!-- 热门标签 -->
                    <div class="sidebar-card">
                        <h3 class="sidebar-title">
                            <i class="ri-price-tag-3-line"></i> 热门标签
                        </h3>
                        <div class="tag-cloud" id="tagCloud">
                            <!-- 动态加载 -->
                        </div>
                    </div>

                    <!-- 热门文章 -->
                    <div class="sidebar-card">
                        <h3 class="sidebar-title">
                            <i class="ri-fire-line"></i> 热门文章
                        </h3>
                        <ul class="hot-posts" id="hotPosts">
                            <!-- 动态加载 -->
                        </ul>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="index.html" class="logo">
                        <i class="ri-quill-pen-line"></i>
                        <span>MyBlog</span>
                    </a>
                    <p>分享技术，记录生活</p>
                </div>
                <div class="footer-links">
                    <a href="https://github.com" target="_blank"><i class="ri-github-fill"></i></a>
                    <a href="https://twitter.com" target="_blank"><i class="ri-twitter-x-fill"></i></a>
                    <a href="mailto:contact@example.com"><i class="ri-mail-line"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 MyBlog. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop">
        <i class="ri-arrow-up-line"></i>
    </button>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
