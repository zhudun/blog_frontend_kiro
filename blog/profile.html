<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="ri-quill-pen-line"></i>
                <span>MyBlog</span>
            </a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="categories.html">分类</a>
                <a href="tags.html">标签</a>
                <a href="about.html">关于</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i class="ri-moon-line"></i>
                </button>
                <div class="user-menu" id="userMenu">
                    <img src="" alt="avatar" class="user-avatar" id="userAvatar">
                    <div class="dropdown">
                        <a href="profile.html" class="active"><i class="ri-user-line"></i> 个人中心</a>
                        <a href="write.html"><i class="ri-edit-line"></i> 写文章</a>
                        <a href="favorites.html"><i class="ri-bookmark-line"></i> 我的收藏</a>
                        <a href="#" id="logoutBtn"><i class="ri-logout-box-line"></i> 退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="profile-page">
        <div class="container">
            <div class="profile-layout">
                <!-- 侧边栏 -->
                <aside class="profile-sidebar">
                    <div class="profile-card">
                        <div class="avatar-wrapper">
                            <img src="" alt="avatar" id="profileAvatar">
                            <label class="avatar-edit" for="avatarInput">
                                <i class="ri-camera-line"></i>
                            </label>
                            <input type="file" id="avatarInput" accept="image/*" hidden>
                        </div>
                        <h2 id="profileName">用户名</h2>
                        <p id="profileEmail">email@example.com</p>
                        <p class="bio" id="profileBio">这个人很懒，什么都没写</p>
                        <div class="social-links" id="socialLinks"></div>
                    </div>
                    
                    <nav class="profile-nav">
                        <a href="#" class="nav-item active" data-tab="posts">
                            <i class="ri-article-line"></i> 我的文章
                        </a>
                        <a href="#" class="nav-item" data-tab="settings">
                            <i class="ri-settings-3-line"></i> 账号设置
                        </a>
                    </nav>
                </aside>

                <!-- 内容区 -->
                <div class="profile-content">
                    <!-- 我的文章 -->
                    <section class="tab-content active" id="postsTab">
                        <div class="content-header">
                            <h2>我的文章</h2>
                            <a href="write.html" class="btn btn-primary">
                                <i class="ri-add-line"></i> 写文章
                            </a>
                        </div>
                        <div class="posts-list" id="myPosts">
                            <!-- 动态加载 -->
                        </div>
                    </section>

                    <!-- 账号设置 -->
                    <section class="tab-content" id="settingsTab">
                        <div class="content-header">
                            <h2>账号设置</h2>
                        </div>
                        
                        <form class="settings-form" id="profileForm">
                            <div class="form-section">
                                <h3>基本信息</h3>
                                <div class="form-group">
                                    <label>用户名</label>
                                    <input type="text" id="settingName" placeholder="请输入用户名">
                                </div>
                                <div class="form-group">
                                    <label>个人简介</label>
                                    <textarea id="settingBio" placeholder="介绍一下自己" rows="3"></textarea>
                                </div>
                            </div>
                            
                            <div class="form-section">
                                <h3>社交链接</h3>
                                <div class="form-group">
                                    <label><i class="ri-github-fill"></i> GitHub</label>
                                    <input type="url" id="settingGithub" placeholder="https://github.com/username">
                                </div>
                                <div class="form-group">
                                    <label><i class="ri-twitter-x-fill"></i> Twitter</label>
                                    <input type="url" id="settingTwitter" placeholder="https://twitter.com/username">
                                </div>
                                <div class="form-group">
                                    <label><i class="ri-global-line"></i> 个人网站</label>
                                    <input type="url" id="settingWebsite" placeholder="https://example.com">
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">保存修改</button>
                        </form>
                        
                        <form class="settings-form" id="passwordForm">
                            <div class="form-section">
                                <h3>修改密码</h3>
                                <div class="form-group">
                                    <label>当前密码</label>
                                    <input type="password" id="currentPassword" placeholder="请输入当前密码">
                                </div>
                                <div class="form-group">
                                    <label>新密码</label>
                                    <input type="password" id="newPassword" placeholder="请输入新密码">
                                </div>
                                <div class="form-group">
                                    <label>确认新密码</label>
                                    <input type="password" id="confirmNewPassword" placeholder="请再次输入新密码">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-outline">修改密码</button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 MyBlog. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
