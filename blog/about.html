<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - 札记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" id="siteHeader"></header>
    <main class="about" id="aboutMain"></main>
    <footer class="site-footer" id="siteFooter"></footer>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/site.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            mountChrome('about');
            document.title = `关于 - ${SITE.name}`;
            document.getElementById('aboutMain').innerHTML = `
                <h1>关于</h1>
                ${SITE.about.map((p) => `<p>${escapeHtml(p)}</p>`).join('')}
            `;
        });
    </script>
</body>
</html>
