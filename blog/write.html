<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 - 札记</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="write-top">
        <a class="back" href="index.html" id="brandLink">返回</a>
        <div class="write-actions">
            <button type="button" class="text-btn" data-theme-toggle>暗</button>
            <button type="button" class="quiet-btn" id="previewToggle">预览</button>
            <button type="button" class="quiet-btn" id="saveDraft">存草稿</button>
            <button type="button" class="solid-btn" id="publishBtn">发布</button>
        </div>
    </header>
    <main class="write-layout">
        <section>
            <input class="write-title" id="postTitle" type="text" placeholder="标题" aria-label="标题">
            <div class="editor-tools" id="editorTools">
                <button type="button" data-action="bold">粗体</button>
                <button type="button" data-action="italic">斜体</button>
                <button type="button" data-action="heading">标题</button>
                <button type="button" data-action="quote">引用</button>
                <button type="button" data-action="code">代码</button>
                <button type="button" data-action="link">链接</button>
                <button type="button" data-action="image">图片</button>
                <button type="button" data-action="ul">列表</button>
            </div>
            <div class="editor-wrap" id="editorWrap">
                <textarea id="editor" placeholder="从这里写起。支持 Markdown。" aria-label="正文"></textarea>
                <div class="preview prose" id="preview"></div>
            </div>
            <div class="editor-status">
                <span id="wordCount">0 字</span>
                <span id="readTime">约 1 分钟</span>
            </div>
            <input type="file" id="imageInput" accept="image/*" hidden>
        </section>
        <aside class="settings">
            <label>
                <span class="label">分类</span>
                <select id="categorySelect" aria-label="分类">
                    <option value="">选择分类</option>
                </select>
            </label>
            <div>
                <span class="label">标签</span>
                <input id="tagInput" type="text" placeholder="输入后回车" aria-label="标签">
                <div class="tag-row" id="selectedTags"></div>
                <div class="suggestions" id="tagSuggestions"></div>
            </div>
            <label>
                <span class="label">摘要</span>
                <textarea id="excerpt" rows="4" placeholder="不填会从正文截取"></textarea>
            </label>
            <button type="button" class="cover-btn" id="coverUpload">
                <img id="coverPreview" alt="" hidden>
                <span id="uploadPlaceholder">封面（可选）</span>
            </button>
            <input type="file" id="coverInput" accept="image/*" hidden>
        </aside>
    </main>
    <div class="toasts" id="toastContainer"></div>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/site.js"></script>
    <script src="js/write.js"></script>
</body>
</html>
