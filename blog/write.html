<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/write.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="write-header">
        <div class="header-left">
            <a href="index.html" class="back-btn">
                <i class="ri-arrow-left-line"></i>
            </a>
            <input type="text" id="postTitle" placeholder="请输入文章标题..." class="title-input">
        </div>
        <div class="header-right">
            <button class="btn btn-ghost" id="saveDraft">
                <i class="ri-draft-line"></i> 存草稿
            </button>
            <button class="btn btn-primary" id="publishBtn">
                <i class="ri-send-plane-line"></i> 发布
            </button>
        </div>
    </header>

    <!-- 主编辑区 -->
    <main class="write-main">
        <div class="editor-container">
            <!-- 编辑器工具栏 -->
            <div class="editor-toolbar">
                <button type="button" data-action="bold" title="粗体"><i class="ri-bold"></i></button>
                <button type="button" data-action="italic" title="斜体"><i class="ri-italic"></i></button>
                <button type="button" data-action="heading" title="标题"><i class="ri-heading"></i></button>
                <span class="divider"></span>
                <button type="button" data-action="quote" title="引用"><i class="ri-double-quotes-l"></i></button>
                <button type="button" data-action="code" title="代码"><i class="ri-code-line"></i></button>
                <button type="button" data-action="link" title="链接"><i class="ri-link"></i></button>
                <button type="button" data-action="image" title="图片"><i class="ri-image-line"></i></button>
                <span class="divider"></span>
                <button type="button" data-action="ul" title="无序列表"><i class="ri-list-unordered"></i></button>
                <button type="button" data-action="ol" title="有序列表"><i class="ri-list-ordered"></i></button>
            </div>
            
            <!-- 编辑区域 -->
            <div class="editor-wrapper">
                <textarea id="editor" placeholder="开始写作...支持 Markdown 语法"></textarea>
                <div class="preview" id="preview"></div>
            </div>
            
            <!-- 底部状态栏 -->
            <div class="editor-status">
                <span id="wordCount">0 字</span>
                <span id="readTime">预计阅读 0 分钟</span>
                <button class="preview-toggle" id="previewToggle">
                    <i class="ri-eye-line"></i> 预览
                </button>
            </div>
        </div>
    </main>

    <!-- 发布设置面板 -->
    <aside class="publish-panel" id="publishPanel">
        <div class="panel-header">
            <h3>发布设置</h3>
            <button class="close-btn" id="closePanel">
                <i class="ri-close-line"></i>
            </button>
        </div>
        
        <div class="panel-content">
            <!-- 封面图 -->
            <div class="form-group">
                <label>封面图片</label>
                <div class="cover-upload" id="coverUpload">
                    <img src="" alt="" id="coverPreview" style="display: none;">
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <i class="ri-image-add-line"></i>
                        <span>点击上传封面</span>
                    </div>
                    <input type="file" id="coverInput" accept="image/*" hidden>
                </div>
            </div>
            
            <!-- 分类 -->
            <div class="form-group">
                <label>分类</label>
                <select id="categorySelect">
                    <option value="">请选择分类</option>
                </select>
            </div>
            
            <!-- 标签 -->
            <div class="form-group">
                <label>标签</label>
                <div class="tags-input" id="tagsInput">
                    <div class="selected-tags" id="selectedTags"></div>
                    <input type="text" id="tagInput" placeholder="输入标签后回车">
                </div>
                <div class="tag-suggestions" id="tagSuggestions"></div>
            </div>
            
            <!-- 摘要 -->
            <div class="form-group">
                <label>文章摘要</label>
                <textarea id="excerpt" placeholder="请输入文章摘要（可选）" rows="3"></textarea>
            </div>
            
            <!-- 设置选项 -->
            <div class="form-group">
                <label class="checkbox">
                    <input type="checkbox" id="featured">
                    <span>设为精选文章</span>
                </label>
            </div>
        </div>
        
        <div class="panel-footer">
            <button class="btn btn-outline" id="cancelPublish">取消</button>
            <button class="btn btn-primary" id="confirmPublish">确认发布</button>
        </div>
    </aside>
    
    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/write.js"></script>
</body>
</html>
