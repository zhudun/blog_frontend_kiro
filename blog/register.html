<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="ri-quill-pen-line"></i>
                    <span>MyBlog</span>
                </a>
                <h1>创建账号</h1>
                <p>加入我们，开始你的创作之旅</p>
            </div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="name">用户名</label>
                    <div class="input-wrapper">
                        <i class="ri-user-line"></i>
                        <input type="text" id="name" placeholder="请输入用户名" required minlength="2" maxlength="50">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <div class="input-wrapper">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="email" placeholder="请输入邮箱" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-wrapper">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" placeholder="请输入密码（6-20位）" required minlength="6" maxlength="20">
                        <button type="button" class="toggle-password">
                            <i class="ri-eye-off-line"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <div class="input-wrapper">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="confirmPassword" placeholder="请再次输入密码" required>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="agree" required>
                        <span>我已阅读并同意 <a href="#">服务条款</a></span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <span>注册</span>
                    <i class="ri-arrow-right-line"></i>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>已有账号？<a href="login.html">立即登录</a></p>
            </div>
        </div>
        
        <div class="auth-bg">
            <div class="bg-content">
                <h2>开启创作之旅</h2>
                <p>在这里记录你的想法，分享你的知识，结识志同道合的朋友</p>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // 切换密码显示
        document.querySelector('.toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'ri-eye-line';
            } else {
                input.type = 'password';
                icon.className = 'ri-eye-off-line';
            }
        });
        
        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const agree = document.getElementById('agree').checked;
            
            if (!name || !email || !password || !confirmPassword) {
                showToast('请填写完整信息', 'warning');
                return;
            }
            
            if (password !== confirmPassword) {
                showToast('两次输入的密码不一致', 'warning');
                return;
            }
            
            if (password.length < 6 || password.length > 20) {
                showToast('密码长度需要在6-20位之间', 'warning');
                return;
            }
            
            if (!agree) {
                showToast('请同意服务条款', 'warning');
                return;
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line"></i> 注册中...';
            
            try {
                const res = await authAPI.register({ name, email, password });
                
                if (res.code === 200) {
                    showToast('注册成功，请登录', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    showToast(res.message || '注册失败', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span>注册</span><i class="ri-arrow-right-line"></i>';
                }
            } catch (error) {
                showToast('注册失败，请稍后重试', 'error');
                btn.disabled = false;
                btn.innerHTML = '<span>注册</span><i class="ri-arrow-right-line"></i>';
            }
        });
        
        // 如果已登录，跳转首页
        if (api.getToken()) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
